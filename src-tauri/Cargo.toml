[package]
name = "ov-refund"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OV Refund — local NS delay-compensation assistant"

[[bin]]
name = "ov-refund"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ovrefund-core = { path = "../crates/ovrefund-core" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
log = { version = "0.4", features = ["std"] }
dirs = "6"
keyring = { version = "3", features = ["windows-native"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
once_cell = "1"
base64 = "0.22"
png = "0.18"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
crossbeam-channel = "0.5"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_Threading"] }
windows-core = "0.62.2"

[features]
# Embed the built frontend (dist/) instead of loading the dev server. `tauri build` enables this automatically.
custom-protocol = ["tauri/custom-protocol"]
# Developer-only diagnostics against the live NS site (never in release installers).
devtools = []

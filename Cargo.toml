[workspace]
resolver = "2"
members = ["crates/ovrefund-core", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/ov-refund/OV-Refund"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Smaller, faster debug builds (line tables are enough for backtraces).
# Fast optimised build for demo/GUI tests and screenshots (not for releases):
# no LTO, parallel codegen, incremental. Use: cargo build --profile fastrelease ...
[profile.fastrelease]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
incremental = true
strip = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

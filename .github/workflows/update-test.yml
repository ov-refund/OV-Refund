name: Update and removal test

on:
  workflow_dispatch:
  push:
    branches: [update-test]

permissions:
  contents: read

jobs:
  update-test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPDATE_TEST_LOGS: ${{ github.workspace }}\update-test-logs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'FAIL npm ci' }
      - name: Generate disposable key and build both NSIS versions
        run: ./tools/ci/update-build.ps1 -Phase Build
      - name: Sign finished updater artifact in isolated environment
        run: ./tools/ci/update-build.ps1 -Phase Sign
      - name: Installed updater and uninstall scenarios
        run: ./tools/ci/update-test.ps1
      - name: Remove temporary test files and processes
        if: always()
        run: ./tools/ci/update-cleanup.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-test-logs
          path: update-test-logs/*.log
          if-no-files-found: warn
          retention-days: 7

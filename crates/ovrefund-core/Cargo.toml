[package]
name = "ovrefund-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for OV Refund: journeys, schedule evidence, eligibility, claims ledger"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "chrono", "cache"] }
csv = "1.3"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
log = "0.4"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
mailparse = "0.16"

[dev-dependencies]
tempfile = "3"
